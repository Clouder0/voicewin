name: VoiceWin macOS Unsigned Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-macos-unsigned:
    runs-on: macos-14
    env:
      # On Apple Silicon runners, whisper-rs/ggml native CPU probing can produce
      # mixed i8mm flags that fail C compilation. Force non-native ggml flags.
      CMAKE_ARGS: -DGGML_NATIVE=OFF

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag commit is reachable from main."
          else
            echo "ERROR: Tag commit is not reachable from main." >&2
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Apple Silicon Rust target
        run: rustup target add aarch64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            voicewin-tauri/src-tauri -> voicewin-tauri/src-tauri/target

      - name: Install frontend dependencies
        working-directory: voicewin-tauri
        run: bun install

      - name: Frontend tests
        working-directory: voicewin-tauri
        run: bun run test

      - name: Rust workspace tests
        run: cargo test

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Build Tauri app (unsigned macOS bundle)
        working-directory: voicewin-tauri
        run: cargo tauri build --target aarch64-apple-darwin

      - name: Verify app binary is arm64
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          apps=(voicewin-tauri/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app)
          if [ ${#apps[@]} -eq 0 ]; then
            echo "ERROR: No .app bundle found under aarch64 target output." >&2
            exit 1
          fi

          app="${apps[0]}"
          binaries=("$app"/Contents/MacOS/*)
          if [ ${#binaries[@]} -eq 0 ]; then
            echo "ERROR: No executable found inside $app/Contents/MacOS." >&2
            exit 1
          fi

          file_output="$(file "${binaries[0]}")"
          echo "$file_output"
          if [[ "$file_output" != *"arm64"* ]]; then
            echo "ERROR: Built app binary is not arm64." >&2
            exit 1
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VoiceWin-macos-unsigned
          path: |
            voicewin-tauri/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            voicewin-tauri/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: error
