name: VoiceWin macOS Unsigned Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-macos-unsigned:
    runs-on: macos-14
    env:
      # whisper-rs-sys vendors ggml. Setting SOURCE_DATE_EPOCH makes ggml default
      # to non-native CPU flags, avoiding i8mm/native probe mismatches on CI.
      SOURCE_DATE_EPOCH: "1"
      # ggml-backend-reg.cpp in current whisper-rs-sys needs std::filesystem
      # APIs gated behind macOS 10.15+; Apple Silicon also requires macOS 11+.
      MACOSX_DEPLOYMENT_TARGET: "11.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag commit is reachable from main."
          else
            echo "ERROR: Tag commit is not reachable from main." >&2
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Apple Silicon Rust target
        run: rustup target add aarch64-apple-darwin

      - name: Verify deployment target configuration
        shell: bash
        run: |
          set -euo pipefail
          echo "MACOSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET"
          python - <<'PY'
          import json
          conf = json.load(open('voicewin-tauri/src-tauri/tauri.conf.json', 'r', encoding='utf-8'))
          version = conf['bundle']['macOS'].get('minimumSystemVersion')
          print(f"tauri minimumSystemVersion={version}")
          if version != '11.0':
              raise SystemExit('tauri minimumSystemVersion must be 11.0 for arm64 builds')
          PY

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            voicewin-tauri/src-tauri -> voicewin-tauri/src-tauri/target

      - name: Install frontend dependencies
        working-directory: voicewin-tauri
        run: bun install

      - name: Frontend tests
        working-directory: voicewin-tauri
        run: bun run test

      - name: Rust workspace tests
        run: cargo test

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Build Tauri app (unsigned macOS bundle)
        working-directory: voicewin-tauri
        run: cargo tauri build --target aarch64-apple-darwin

      - name: Verify build output is arm64
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          apps=(
            voicewin-tauri/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
            voicewin-tauri/src-tauri/target/release/bundle/macos/*.app
          )

          dmgs=(
            voicewin-tauri/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            voicewin-tauri/src-tauri/target/release/bundle/dmg/*.dmg
          )

          candidate=""
          if [ ${#apps[@]} -gt 0 ]; then
            app="${apps[0]}"
            for bin in "$app"/Contents/MacOS/*; do
              if [ -f "$bin" ]; then
                candidate="$bin"
                break
              fi
            done
          fi

          if [ -z "$candidate" ]; then
            bins=(
              voicewin-tauri/src-tauri/target/aarch64-apple-darwin/release/*
              voicewin-tauri/src-tauri/target/release/*
            )
            for bin in "${bins[@]}"; do
              if [ -f "$bin" ] && [ -x "$bin" ]; then
                candidate="$bin"
                break
              fi
            done
          fi

          if [ -z "$candidate" ]; then
            echo "ERROR: Could not locate built executable for architecture check." >&2
            ls -la voicewin-tauri/src-tauri/target || true
            ls -la voicewin-tauri/src-tauri/target/aarch64-apple-darwin/release || true
            ls -la voicewin-tauri/src-tauri/target/release || true
            exit 1
          fi

          file_output="$(file "$candidate")"
          echo "$file_output"
          if [[ "$file_output" != *"arm64"* ]]; then
            echo "ERROR: Built app binary is not arm64." >&2
            exit 1
          fi

          if [ ${#apps[@]} -eq 0 ] && [ ${#dmgs[@]} -eq 0 ]; then
            echo "ERROR: No macOS bundle artifacts (.app or .dmg) found." >&2
            exit 1
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VoiceWin-macos-unsigned
          path: |
            voicewin-tauri/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            voicewin-tauri/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
            voicewin-tauri/src-tauri/target/release/bundle/dmg/*.dmg
            voicewin-tauri/src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: error
