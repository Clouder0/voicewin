name: VoiceWin Live Provider Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'

jobs:
  live-provider-smoke:
    runs-on: ubuntu-latest
    env:
      VOICEWIN_LIVE_PROVIDER_TESTS: ${{ secrets.ELEVENLABS_SCRIBE_V2_API_KEY != '' && '1' || '0' }}
      ELEVENLABS_SCRIBE_V2_API_KEY: ${{ secrets.ELEVENLABS_SCRIBE_V2_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Run live provider smoke tests
        run: bash scripts/ci/run-live-provider-smoke.sh
