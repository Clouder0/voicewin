name: VoiceWin PR Checks

on:
  pull_request:
  push:
    tags-ignore:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            voicewin-tauri/src-tauri -> voicewin-tauri/src-tauri/target

      - name: Run PR verification script
        run: bash scripts/ci/run-pr-checks.sh
